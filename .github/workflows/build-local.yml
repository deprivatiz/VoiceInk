name: Build VoiceInk Local

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          cmake --version
          mkdir -p "$HOME/Downloads"
          if ! xcrun metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build local app
        shell: bash
        run: |
          set -euo pipefail
          make local LOCAL_CODESIGN_IDENTITY=-

      - name: Verify and package app
        shell: bash
        run: |
          set -euo pipefail
          APP="$HOME/Downloads/VoiceInk.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" artifacts/VoiceInk-Local-AppleSilicon.zip
          shasum -a 256 artifacts/VoiceInk-Local-AppleSilicon.zip \
            > artifacts/SHA256.txt

      - name: Save download
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInk-Local-AppleSilicon
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
